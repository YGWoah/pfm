version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: |
        FROM oven/bun:1 as base
        WORKDIR /usr/src/app
        COPY package*.json ./
        RUN bun install
        COPY prisma ./prisma/
        RUN npx prisma generate
        COPY . .
        EXPOSE 8080
        CMD ["bun", "bin/www.ts"]
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/mydatabase
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "run", "--silent", "bin/www.ts"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: